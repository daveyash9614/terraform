name: "Terraform - UAT"

on:
  push:
    branches-ignore: [ "main" ]
    paths:
      - 'environments/uat/**'
      - 'modules/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'environments/uat/**'
      - 'modules/**'

concurrency:
  group: tf-uat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  uat-pipeline:
    uses: ./.github/workflows/master-terraform-base.yml
    with:
      environment: 'uat'
      working_directory: './environments/uat'
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
